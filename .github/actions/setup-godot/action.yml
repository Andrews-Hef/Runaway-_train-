name: Installer Godot
description: Télécharge Godot (et, au besoin, ses modèles d'export) avec un cache, puis définit $GODOT.

inputs:
  version:
    description: Version de Godot, telle que nommée dans godot-builds (ex. 4.7-stable).
    required: true
  templates:
    description: Installer aussi les modèles d'export Android, Windows et Linux.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Cache de Godot
      id: cache-bin
      uses: actions/cache@v6
      with:
        path: ~/godot
        key: godot-bin-${{ inputs.version }}

    - name: Télécharger Godot
      if: steps.cache-bin.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        mkdir -p ~/godot
        curl -fsSL -o "$RUNNER_TEMP/godot.zip" \
          "https://github.com/godotengine/godot-builds/releases/download/${VERSION}/Godot_v${VERSION}_linux.x86_64.zip"
        unzip -q "$RUNNER_TEMP/godot.zip" -d ~/godot

    - name: Cache des modèles d'export
      if: inputs.templates == 'true'
      id: cache-templates
      uses: actions/cache@v6
      with:
        path: ~/.local/share/godot/export_templates
        key: godot-templates-${{ inputs.version }}

    # L'archive complète pèse 1,3 Go : on n'en garde que ce que nos presets utilisent.
    - name: Télécharger les modèles d'export
      if: inputs.templates == 'true' && steps.cache-templates.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        DIR=~/.local/share/godot/export_templates/${VERSION/-/.}
        mkdir -p "$DIR"
        curl -fsSL -o "$RUNNER_TEMP/templates.tpz" \
          "https://github.com/godotengine/godot-builds/releases/download/${VERSION}/Godot_v${VERSION}_export_templates.tpz"
        unzip -q -o -j "$RUNNER_TEMP/templates.tpz" -d "$DIR" \
          templates/version.txt \
          templates/android_release.apk templates/android_debug.apk \
          templates/windows_release_x86_64.exe templates/windows_release_x86_64_console.exe \
          templates/linux_release.x86_64
        rm "$RUNNER_TEMP/templates.tpz"

    - name: Définir $GODOT
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: echo "GODOT=$HOME/godot/Godot_v${VERSION}_linux.x86_64" >> "$GITHUB_ENV"
